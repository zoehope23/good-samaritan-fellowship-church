<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel – Good Samaritan Fellowship</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #0f1923; }

    /* ── LOGIN ── */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #0D1B2A 0%, #1A2F45 100%);
    }
    .login-card {
      background: var(--white);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
      text-align: center;
    }
    .login-card img { height: 60px; margin: 0 auto 20px; }
    .login-card h2 { font-size: 1.8rem; color: var(--navy); margin-bottom: 6px; }
    .login-card p { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 32px; }
    .login-card .form-group { text-align: left; margin-bottom: 20px; }
    .login-card .form-group label { display: block; font-weight: 600; font-size: 0.875rem; color: var(--navy); margin-bottom: 6px; }
    .login-card .form-group input {
      width: 100%; padding: 12px 16px;
      border: 2px solid var(--border); border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
      outline: none; transition: var(--transition);
    }
    .login-card .form-group input:focus { border-color: var(--gold); }
    .login-error { color: #c62828; font-size: 0.875rem; margin-bottom: 16px; display: none; }

    /* ── ADMIN LAYOUT ── */
    .admin-shell { display: none; min-height: 100vh; flex-direction: column; }
    .admin-topbar {
      background: var(--navy);
      border-bottom: 2px solid var(--gold);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .admin-topbar-brand {
      display: flex; align-items: center; gap: 12px;
    }
    .admin-topbar-brand img { height: 40px; }
    .admin-topbar-brand span { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; color: var(--gold-light); font-weight: 700; }
    .admin-topbar-actions { display: flex; gap: 12px; align-items: center; }
    .admin-topbar-actions span { color: rgba(255,255,255,0.6); font-size: 0.875rem; }
    .admin-body {
      flex: 1;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      padding: 40px 24px;
    }

    /* ── STATS ── */
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: var(--white);
      border-radius: 10px;
      padding: 24px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--gold);
    }
    .stat-card .stat-val { font-size: 2.2rem; font-weight: 800; color: var(--navy); line-height: 1; }
    .stat-card .stat-label { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; }

    /* ── EVENT FORM ── */
    .admin-section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      color: var(--white);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .event-form {
      background: var(--white);
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 40px;
      box-shadow: var(--shadow);
    }
    .event-form h3 { font-size: 1.4rem; color: var(--navy); margin-bottom: 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 600; font-size: 0.85rem; color: var(--navy); margin-bottom: 6px; }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%; padding: 10px 14px;
      border: 2px solid var(--border); border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
      color: var(--text); outline: none; transition: var(--transition);
      background: var(--cream);
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--gold); background: var(--white); }
    .form-group textarea { min-height: 90px; resize: vertical; }
    .form-group.full { grid-column: span 2; }
    .form-actions { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; }
    .img-preview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 6px; margin-top: 10px; display: none; }

    /* ── EVENT LIST ── */
    .events-list { display: flex; flex-direction: column; gap: 16px; }
    .admin-event-row {
      background: var(--white);
      border-radius: 10px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: var(--shadow);
    }
    .aer-img { width: 72px; height: 56px; object-fit: cover; border-radius: 6px; background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
    .aer-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
    .aer-info { flex: 1; min-width: 0; }
    .aer-info h4 { font-size: 1rem; color: var(--navy); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .aer-info span { font-size: 0.8rem; color: var(--text-muted); }
    .aer-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .aer-actions button {
      padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; border: none; transition: var(--transition); font-family: 'DM Sans', sans-serif;
    }
    .btn-publish { background: #e8f5e9; color: #2e7d32; }
    .btn-publish:hover { background: #c8e6c9; }
    .btn-draft { background: var(--cream); color: var(--text-muted); border: 1px solid var(--border); }
    .btn-draft:hover { background: var(--border); }
    .btn-edit { background: var(--gold-pale); color: var(--gold); }
    .btn-edit:hover { background: #f0e0a0; }
    .btn-delete { background: #ffebee; color: #c62828; }
    .btn-delete:hover { background: #ffcdd2; }
    .no-events-msg { text-align: center; padding: 48px; color: rgba(255,255,255,0.5); font-size: 1rem; }

    @media (max-width: 700px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: span 1; }
      .admin-stats { grid-template-columns: 1fr; }
      .admin-event-row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <img src="assets/logo.png" alt="GSF Logo">
    <h2>Admin Login</h2>
    <p>Good Samaritan Fellowship — Church Management</p>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="loginUser" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="login-error" id="loginError">Incorrect username or password. Please try again.</div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doLogin()">Login →</button>
  </div>
</div>

<!-- ADMIN SHELL -->
<div class="admin-shell" id="adminShell">
  <div class="admin-topbar">
    <div class="admin-topbar-brand">
      <img src="assets/logo.png" alt="GSF">
      <span>GSF Admin Panel</span>
    </div>
    <div class="admin-topbar-actions">
      <span>Welcome, Admin</span>
      <a href="index.html" class="btn btn-outline-white" style="padding:6px 16px;font-size:0.8rem">View Site</a>
      <button class="btn btn-outline-white" style="padding:6px 16px;font-size:0.8rem" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="admin-body">
    <!-- Stats -->
    <div class="admin-stats">
      <div class="stat-card">
        <div class="stat-val" id="statTotal">0</div>
        <div class="stat-label">Total Events</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statPublished">0</div>
        <div class="stat-label">Published</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statDraft">0</div>
        <div class="stat-label">Drafts</div>
      </div>
    </div>

    <!-- Form -->
    <h2 class="admin-section-title" id="formTitle">➕ Add New Event</h2>
    <div class="event-form">
      <input type="hidden" id="editId">
      <div class="form-grid">
        <div class="form-group">
          <label>Event Title *</label>
          <input type="text" id="evTitle" placeholder="e.g. Church Anniversary Celebration">
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="evDate">
        </div>
        <div class="form-group">
          <label>Time</label>
          <input type="time" id="evTime">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="evStatus">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Description</label>
          <textarea id="evDesc" placeholder="Describe the event..."></textarea>
        </div>
        <div class="form-group full">
          <label>Programme / Agenda</label>
          <textarea id="evAgenda" placeholder="e.g. 8:00 AM – Worship&#10;8:30 AM – Message&#10;9:15 AM – Prayer"></textarea>
        </div>
        <div class="form-group full">
          <label>Event Image (upload photo)</label>
          <input type="file" id="evImageFile" accept="image/*" onchange="previewImage()">
          <img class="img-preview" id="imgPreview" alt="Event image preview">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-outline" onclick="cancelEdit()" id="cancelBtn" style="display:none">Cancel</button>
        <button class="btn" style="background:#e8f5e9;color:#2e7d32;border-color:#c8e6c9" onclick="saveEvent('draft')">Save as Draft</button>
        <button class="btn btn-primary" onclick="saveEvent('published')">Publish Event</button>
      </div>
    </div>

    <!-- Event list -->
    <h2 class="admin-section-title">📋 All Events</h2>
    <div class="events-list" id="eventsList"></div>
  </div>
</div>

<script>
  const ADMIN_USER = 'admin';
  const ADMIN_PASS = 'admin123';
  const STORAGE_KEY = 'eventsData';
  let events = [];
  let editMode = false;

  // ── AUTH ──
  function doLogin() {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    if (u === ADMIN_USER && p === ADMIN_PASS) {
      localStorage.setItem('gsf_admin_logged_in', '1');
      showAdmin();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  function doLogout() {
    localStorage.removeItem('gsf_admin_logged_in');
    location.reload();
  }

  function showAdmin() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminShell').style.display = 'flex';
    loadEvents();
  }

  // Check session on load
  if (localStorage.getItem('gsf_admin_logged_in') === '1') showAdmin();

  // ── DATA ──
  function loadEvents() {
    events = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    renderStats();
    renderList();
  }

  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    renderStats();
    renderList();
  }

  function renderStats() {
    const pub = events.filter(e => e.status === 'published').length;
    document.getElementById('statTotal').textContent = events.length;
    document.getElementById('statPublished').textContent = pub;
    document.getElementById('statDraft').textContent = events.length - pub;
  }

  // ── IMAGE ──
  function previewImage() {
    const file = document.getElementById('evImageFile').files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const prev = document.getElementById('imgPreview');
      prev.src = e.target.result;
      prev.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  // ── SAVE ──
  function saveEvent(statusOverride) {
    const title = document.getElementById('evTitle').value.trim();
    if (!title) { alert('Please enter an event title.'); return; }

    const fileInput = document.getElementById('evImageFile');
    const existingPreview = document.getElementById('imgPreview').src;

    function doSave(imgDataUrl) {
      const id = document.getElementById('editId').value;
      const eventData = {
        id: id || Date.now().toString(),
        title,
        date: document.getElementById('evDate').value,
        time: document.getElementById('evTime').value,
        description: document.getElementById('evDesc').value.trim(),
        agenda: document.getElementById('evAgenda').value.trim(),
        status: statusOverride || document.getElementById('evStatus').value,
        image: imgDataUrl || (id ? (events.find(e => e.id === id) || {}).image : null),
      };

      if (id) {
        const idx = events.findIndex(e => e.id === id);
        if (idx !== -1) events[idx] = eventData;
      } else {
        events.unshift(eventData);
      }

      saveToStorage();
      clearForm();
      alert(`Event "${title}" has been ${eventData.status === 'published' ? 'published' : 'saved as draft'} successfully!`);
    }

    if (fileInput.files[0]) {
      const reader = new FileReader();
      reader.onload = e => doSave(e.target.result);
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      doSave(null);
    }
  }

  // ── EDIT ──
  function editEvent(id) {
    const e = events.find(ev => ev.id === id);
    if (!e) return;
    editMode = true;
    document.getElementById('formTitle').textContent = '✏️ Edit Event';
    document.getElementById('cancelBtn').style.display = 'inline-flex';
    document.getElementById('editId').value = e.id;
    document.getElementById('evTitle').value = e.title;
    document.getElementById('evDate').value = e.date || '';
    document.getElementById('evTime').value = e.time || '';
    document.getElementById('evDesc').value = e.description || '';
    document.getElementById('evAgenda').value = e.agenda || '';
    document.getElementById('evStatus').value = e.status;
    if (e.image) {
      const prev = document.getElementById('imgPreview');
      prev.src = e.image;
      prev.style.display = 'block';
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEdit() {
    clearForm();
  }

  function clearForm() {
    editMode = false;
    document.getElementById('formTitle').textContent = '➕ Add New Event';
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('editId').value = '';
    document.getElementById('evTitle').value = '';
    document.getElementById('evDate').value = '';
    document.getElementById('evTime').value = '';
    document.getElementById('evDesc').value = '';
    document.getElementById('evAgenda').value = '';
    document.getElementById('evStatus').value = 'draft';
    document.getElementById('evImageFile').value = '';
    const prev = document.getElementById('imgPreview');
    prev.src = '';
    prev.style.display = 'none';
  }

  // ── DELETE ──
  function deleteEvent(id) {
    const e = events.find(ev => ev.id === id);
    if (!e) return;
    if (!confirm(`Delete "${e.title}"? This cannot be undone.`)) return;
    events = events.filter(ev => ev.id !== id);
    saveToStorage();
  }

  // ── TOGGLE STATUS ──
  function toggleStatus(id) {
    const e = events.find(ev => ev.id === id);
    if (!e) return;
    e.status = e.status === 'published' ? 'draft' : 'published';
    saveToStorage();
  }

  // ── RENDER LIST ──
  function renderList() {
    const container = document.getElementById('eventsList');
    if (events.length === 0) {
      container.innerHTML = '<p class="no-events-msg">No events yet. Add your first event above.</p>';
      return;
    }
    container.innerHTML = events.map(e => {
      const dateStr = e.date ? new Date(e.date).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'}) : 'No date';
      const imgEl = e.image
        ? `<div class="aer-img"><img src="${e.image}" alt="${e.title}"></div>`
        : `<div class="aer-img">📅</div>`;
      const isPublished = e.status === 'published';
      return `
        <div class="admin-event-row">
          ${imgEl}
          <div class="aer-info">
            <h4>${e.title}</h4>
            <span>${dateStr}${e.time ? ' · ' + e.time : ''}</span>
          </div>
          <span class="badge ${isPublished ? 'badge-green' : 'badge-gold'}" style="flex-shrink:0">${isPublished ? 'Published' : 'Draft'}</span>
          <div class="aer-actions">
            <button class="${isPublished ? 'btn-draft' : 'btn-publish'}" onclick="toggleStatus('${e.id}')">
              ${isPublished ? 'Set Draft' : 'Publish'}
            </button>
            <button class="btn-edit" onclick="editEvent('${e.id}')">Edit</button>
            <button class="btn-delete" onclick="deleteEvent('${e.id}')">Delete</button>
          </div>
        </div>`;
    }).join('');
  }
</script>
</body>
</html>
